<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>星球推演 · 世界生成器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app/timeline.css">
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
  <main id="stage">
    <canvas id="map" aria-label="世界地图"></canvas>
    <div id="tip" class="tip" hidden></div>
  </main>

  <div id="globeWrap" class="globe-wrap" hidden></div>

  <!-- 左侧工具栏 -->
  <nav class="rail" id="rail">
    <button class="rail-btn" data-tool="menu" title="菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="rail-cap">视图</div>
    <button class="rail-btn" data-tool="globe" title="以球体查看整颗星球"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg><span>球体</span></button>
    <button class="rail-btn" data-tool="history" title="历史时间线：从文明之初看到现在"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg><span>历史</span></button>
    <i class="rail-sep"></i>
    <div class="rail-cap">工具</div>
    <button class="rail-btn" data-tool="route" title="路线：两地之间怎么走、要走几天"><svg viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><path d="M9 14v-2.5a1.5 1.5 0 0 1 1.5-1.5H15M13 8l2 2-2 2"/></svg><span>路线</span></button>
    <button class="rail-btn" data-tool="measure" title="测距：在地图上量距离"><svg viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="m7 13 1.5 1.5M10 10l1.5 1.5M13 7l1.5 1.5"/></svg><span>测距</span></button>
    <button class="rail-btn" data-tool="marker" title="标记：在地图上做记号"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span>标记</span></button>
    <i class="rail-sep"></i>
    <div class="rail-cap">显示</div>
    <button class="rail-btn" data-tool="style" title="地图风格：古典、水墨、航海图……"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10.5" cy="7" r="1.3"/><circle cx="15" cy="7.5" r="1.3"/></svg><span>风格</span></button>
    <button class="rail-btn on" data-tool="hover" title="悬浮信息：鼠标停在地图上显示该处信息（再点一次关闭）"><svg viewBox="0 0 24 24"><path d="M5 3l13 7-6 1.5L9 18z"/></svg><span>悬浮信息</span></button>
    <div class="rail-sp"></div>
    <button class="rail-btn" data-tool="info" title="星球档案：这颗星球的各项数据"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>信息</span></button>
  </nav>

  <!-- 搜索 + 世界卡片 -->
  <div class="topleft">
    <div class="search">
      <input id="q" type="search" placeholder="搜索城市、国家、省份或地貌" autocomplete="off" spellcheck="false">
      <svg class="search-ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <i class="search-sep"></i>
      <button class="search-route" id="searchRoute" title="路线"><svg viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><path d="M9 14v-2.5a1.5 1.5 0 0 1 1.5-1.5H15M13 8l2 2-2 2"/></svg></button>
      <div class="results" id="results" hidden></div>
    </div>
    <div class="card world-card" id="worldCard">
      <b id="worldName" data-name-id="world" title="双击改名">尚未推演</b>
      <span id="worldStats">回答 21 个问题，推演一颗新星球</span>
    </div>
    <div class="card tool-card" id="toolCard" hidden></div>
  </div>

  <!-- 底部：图层 + 图例 -->
  <div class="bottomleft">
    <button class="layer-btn" id="layerBtn"><img id="layerThumb" alt=""><span><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>图层</span></button>
    <div class="legend-wrap">
      <button class="card legend-btn" id="legendBtn"><span id="legendTitle">地形与水系图例</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
      <div class="card legend" id="legend" hidden></div>
    </div>
  </div>

  <!-- 右下：缩放 + 比例尺 -->
  <div class="bottomright">
    <div class="card zoom">
      <button id="zin" title="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zout" title="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zfit" class="zfit">全图</button>
    </div>
    <div class="scale"><span id="scaleText">2000 km</span><i id="scaleBar"></i></div>
  </div>

  <!-- 图层面板 -->
  <section class="card panel" id="layerPanel" hidden>
    <header><h2>地图图层</h2><button class="x" data-close="layerPanel" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="tabs" id="tabs">
      <button data-tab="geo" class="on">地理</button><button data-tab="human">人文</button><button data-tab="season">季风</button><button data-tab="plates">板块</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </section>

  <!-- 信息抽屉 -->
  <section class="card drawer" id="infoPanel" hidden>
    <header><h2>星球档案</h2><button class="x" data-close="infoPanel" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="panel-body" id="infoBody"></div>
  </section>

  <!-- 已保存的世界 -->
  <section class="card drawer saved" id="savedPanel" hidden>
    <header><h2>我的世界</h2><button class="x" data-close="savedPanel" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="panel-body" id="savedBody"></div>
  </section>
  <input type="file" id="importFile" accept=".json,application/json" hidden>

  <!-- 菜单 -->
  <div class="card menu" id="menu" hidden>
    <button data-act="home">首页 · 我的世界</button>
    <button data-act="library">文化库</button>
    <button data-act="religions">宗教库</button>
    <button data-act="wizard">新的推演（21 题）</button>
    <button data-act="reseed">同样设定，换一颗星球</button>
    <button data-act="png">导出当前地图 PNG</button>
    <button data-act="share">复制分享链接</button>
    <button data-act="export">导出当前世界文件</button>
    <button data-act="import">导入世界文件…</button>
  </div>

  <!-- 推演进度 -->
  <div class="overlay" id="progress" hidden>
    <div class="card progress-card">
      <canvas id="spinGlobe" width="120" height="120"></canvas>
      <h3 id="progTitle">正在构思一颗新的星球</h3>
      <div class="bar"><i id="progBar"></i></div>
      <p id="progStage" class="prog-small">准备推演</p>
    </div>
  </div>

  <!-- 21 题向导 -->
  <div class="overlay wizard" id="wizard" hidden>
    <div class="card wiz">
      <header class="wiz-head">
        <div><h2>推演一颗新星球</h2><p id="wizSub">回答 21 个问题，决定这颗星球的天文、地质、气候与文明</p></div>
        <button class="x" id="wizClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="wiz-steps" id="wizSteps"></div>
      <div class="wiz-body" id="wizBody"></div>
      <footer class="wiz-foot">
        <button class="btn ghost" id="wizRandom">全部随机</button>
        <button class="btn ghost" id="wizSaved">我的世界</button>
        <div class="dots" id="wizDots"></div>
        <button class="btn ghost" id="wizPrev">上一步</button>
        <button class="btn primary" id="wizNext">下一步</button>
      </footer>
    </div>
  </div>


  <!-- 首页：生成任务 + 已保存的世界 -->
  <section class="home" id="home" hidden>
    <div class="home-inner">
      <header class="home-head">
        <div class="home-logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg><b>世界生成器</b></div>
        <div class="home-actions"><button class="btn ghost" id="homeLib">文化库 <small id="homeLibCount"></small></button><button class="btn ghost" id="homeRel">宗教库</button><button class="btn primary" id="homeCreate">＋ 创建世界</button></div>
      </header>
      <div id="homeJobSec" hidden><h2>正在推演</h2><div class="home-sub"><span>推演完成后会出现在下方“已保存的世界”。</span><span id="homeJobCount"></span></div>
      <div class="wgrid" id="homeJobs"></div>
      <div class="home-sep"></div></div>
      <h2>已保存的世界</h2><div class="home-sub"><span>打开地图，继续探索。双击世界名称可改名。</span><span><button class="link" id="homeImport">导入世界文件</button> · <span id="homeCount"></span></span></div>
      <div class="wgrid" id="homeSaved"></div>
      <footer class="home-foot"><span>世界生成器 · 规则移植自 1.4.0.dev164</span><span>你的世界保存在本机浏览器中，可导出为文件。</span></footer>
    </div>
  </section>

  <!-- 文化库 -->
  <section class="home lib" id="libPage" hidden>
    <div class="home-inner">
      <header class="home-head">
        <div class="home-logo"><button class="btn ghost" id="libBack">← 返回</button><b>文化库</b></div>
        <div class="home-actions"><button class="btn ghost" id="libAll">全选</button><button class="btn ghost" id="libImport">导入 JSON</button><button class="btn ghost" id="libExport">导出所选</button><button class="btn primary" id="libNew">＋ 新建自定义库</button></div>
      </header>
      <p class="home-sub" id="libSummary"></p>
      <div class="lib-tabs" id="libTabs"></div>
      <div class="lgrid" id="libGrid"></div>
    </div>
    <input type="file" id="libFile" accept=".json,application/json" hidden>
  </section>
  <!-- 宗教库 -->
  <section class="home lib" id="relPage" hidden>
    <div class="home-inner">
      <header class="home-head">
        <div class="home-logo"><button class="btn ghost" id="relBack">← 返回</button><b>宗教库</b></div>
        <div class="home-actions"><button class="btn ghost" id="relAll">全选</button><button class="btn ghost" id="relImport">导入 JSON</button><button class="btn ghost" id="relExport">导出所选</button><button class="btn primary" id="relNew">＋ 新建自定义宗教</button></div>
      </header>
      <p class="home-sub" id="relSummary"></p>
      <div class="lib-tabs" id="relTabs"></div>
      <div class="lgrid" id="relGrid"></div>
    </div>
    <input type="file" id="relFile" accept=".json,application/json" hidden>
  </section>
  <div class="overlay" id="libModal" hidden><div class="card libmodal" id="libModalBody"></div></div>

  <!-- 城市详情：用户生成器的城市图 -->
  <aside class="city-panel" id="cityPanel" hidden aria-label="城市详情">
    <header class="city-head">
      <div><p class="city-eyebrow" id="cityEyebrow"></p><h2 id="cityName" title="双击改名"></h2></div>
      <button class="city-x" id="cityClose" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <dl class="city-facts" id="cityFacts"></dl>
    <section id="city-map-section" aria-label="城市与周边地图">
      <div id="city-map-viewport" tabindex="0" aria-label="城市地图，可拖动和缩放">
        <svg id="city-map-canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="城市、地形、水系与农田"><g id="city-map-camera"><g id="city-fabric-layer"></g></g></svg>
        <div class="city-map-extents"><button id="city-map-city" type="button" aria-pressed="true">城市</button><button id="city-map-region" type="button" aria-pressed="false">周边</button></div>
        <div class="city-map-compass" aria-hidden="true">N<span>↑</span></div>
        <output id="city-map-status" role="status" aria-live="polite"></output>
        <nav class="city-map-tools"><button id="city-map-zoom-in" type="button" title="放大">＋</button><button id="city-map-zoom-out" type="button" title="缩小">−</button><button id="city-map-reset" type="button" title="复位">⌂</button></nav>
        <div class="city-map-scale"><span id="city-scale-label"></span><i id="city-scale-rule"></i></div>
      </div>
      <div class="city-map-caption"><span><i class="city-key-building"></i>建成区</span><span><i class="city-key-road"></i>城市干道</span><span><i class="city-key-wall"></i>城墙与城门</span><span><i class="city-key-water"></i>水系</span><span class="hint">拖动平移 · 滚轮缩放 · 城市 / 周边切换范围</span></div>
    </section>
    <footer class="city-actions">
      <button class="btn ghost" id="cityLocate">在地图中定位</button>
      <button class="btn ghost" id="place-regenerate" hidden></button>
      <button class="btn ghost" id="cityRegen">重新生成</button>
      <span class="sp"></span>
      <button class="btn ghost" id="citySave">导出城市存档</button>
      <button class="btn ghost" id="cityOpen">导入</button>
      <input type="file" id="cityFile" accept=".json,application/json" hidden>
    </footer>
  </aside>

  <div class="card style-panel" id="stylePanel" hidden>
    <h4>地图风格</h4>
    <div class="style-grid" id="styleGrid"></div>
  </div>
  <div class="card city-card" id="cityCard" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app/config.js"></script>
  <script src="app/wizard.js"></script>
  <script src="app/map.js"></script>
  <script src="app/home.js"></script>
  <script src="app/religion-lib.js"></script>
  <script src="app/city.js"></script>
  <script src="app/timeline.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
