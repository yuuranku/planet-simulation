name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 版本一致性
        run: npm run sync-version

      - name: 构建发布产物
        run: npm run build

      - name: 全量校验（含测试）
        run: npm run verify

      - name: 冒烟测试
        run: npm run smoke

  android:
    name: Android APK 编译验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 并生成发布产物
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # build.gradle 的 copySite 从 ../dist/android/site 打包，必须先构建。
      - name: 构建 dist/android/site
        run: npm run build

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK；若缺组件则用 sdkmanager 补齐（保证 CI 可复现）。
      - name: 准备 Android SDK 组件
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDKROOT"
          SDKMANAGER=$(find "$SDKROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::未找到 sdkmanager，Android SDK 不可用"; exit 1; fi
          if [ ! -d "$SDKROOT/platforms/android-35" ] || [ ! -d "$SDKROOT/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$SDKROOT/platforms/android-35" && test -d "$SDKROOT/build-tools/35.0.0"

      # 使用 Gradle 8.9（与 android/README.md 要求一致）；项目无 wrapper，用 setup-gradle 提供。
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 真编译 APK（debug 用本机调试密钥，无需仓库外发布密钥），证明源码与资源可被打包。
      - name: 编译 Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 校验 APK 产物
        run: |
          APK=android/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::未找到 APK 产物 $APK"; exit 1; }
          echo "APK 构建成功：$(du -h "$APK" | cut -f1)"
          # 校验 APK 是合法 zip（APK 本质为 zip 容器），并非空壳
          unzip -t "$APK" >/dev/null && echo "APK 容器校验通过"
