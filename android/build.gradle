plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'cn.planet.world'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'cn.planet.world'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '1.4.6.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            assets.srcDirs = ['assets', layout.buildDirectory.dir('generated/site-assets')]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// WebViewAssetLoader expects the shared site under assets/site in the APK.
// 从 dist/android/site 打包（而非源码 site/），确保缓存串已被 build.mjs 统一、产物可复现。
// 构建顺序：先 `npm run build` 生成 dist/，再用 Gradle 打包 APK。
def distSite = '../dist/android/site'
def copySite = tasks.register('copySite', Sync) {
    from distSite
    into layout.buildDirectory.dir('generated/site-assets/site')
    doFirst {
        if (!file(distSite + '/index.html').isFile()) {
            throw new GradleException('dist/android/site/index.html is missing — run `npm run build` before assembling the APK.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn copySite }
